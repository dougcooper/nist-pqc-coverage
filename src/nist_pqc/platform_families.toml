# Chipset and platform families for the ESV shortlist.
#
# NIST publishes operating environments as free text. Each family below is a
# conservative regex matched against one semicolon-separated environment
# string. A certificate can match several families, so family counts overlap.
#
# This list covers embedded chipsets, server and PC processors, and security
# chips. SSD/storage-controller subsystems are intentionally left out: they do
# not identify a reusable platform family in the same way as a CPU or SoC.
#
# Add a family here and rerun `just scrape`; certificates that match no family
# stay in platform_unmapped_certs.csv so new platforms are not hidden.
#
# Patterns are Python regular expressions, compiled case-insensitively.

[[family]]
name = "STM32"
vendor = "STMicroelectronics"
category = "MCU / MPU"
pattern = '\bSTM32'

[[family]]
name = "Samsung Exynos / custom"
vendor = "Samsung"
category = "Mobile SoC"
pattern = 'Exynos|Samsung.*(?:ELAN|Eldora|Evan|Elroy)|S4L[A-Z]\d'

[[family]]
name = "Apple A / M / S"
vendor = "Apple"
category = "Application processor"
pattern = '\bApple\b.*(?:\b(?:A|M|S)\s*Series\b|\bA1[2-9]\s+Bionic\b|\bM[1-4]\b|\bS[5-9]\b)'

[[family]]
name = "Infineon security controller"
vendor = "Infineon"
category = "Secure element"
pattern = '\bSLB\s?\d|\bSLC\s?\d|\bCYB\d|OPTIGA|\bM7893'

[[family]]
name = "Xilinx Zynq / UltraScale"
vendor = "AMD / Xilinx"
category = "FPGA SoC"
pattern = 'Zynq|\bXC7Z|\bXCZU|\bXCVU|\bZU\d+EG|\bZC7\d{2}'

[[family]]
name = "NXP i.MX"
vendor = "NXP"
category = "Application processor"
pattern = '\bi\.?\s?mx\s?\d|\bimx\d'

[[family]]
