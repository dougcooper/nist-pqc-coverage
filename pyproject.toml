[project]
name = "nist-pqc"
version = "0.1.0"
description = "Scrape NIST CAVP/CMVP for post-quantum validations and build a coverage dataset"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
]

[project.scripts]
nist-pqc = "nist_pqc.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nist_pqc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
